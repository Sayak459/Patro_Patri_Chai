<section class="register-banner" aria-labelledby="register-banner-title">

        <p class="banner-copy">No waiting around for accidental encounters.<br>Let’s make some introductions happen.</p>

        <p class="banner-signoff"><span></span><em>Come with your stories. Leave room for new ones.</em><span></span></p>
